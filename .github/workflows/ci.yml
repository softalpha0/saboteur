name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint, typecheck and unit/integration tests. No Kane credits are spent here: the Kane wrapper is
# tested with a scripted stand-in binary (see packages/kane/test/fixtures/README.md).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux only for now. Saboteur's real Kane runs (see evidence/README.md) were done on Windows.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm -r typecheck
      - run: pnpm test
      # Recompute every headline number from the committed real reports and check their sha256.
      - if: hashFiles('evidence/data/*.json') != ''
        run: pnpm saboteur verify
